name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./komodo-ders-asistanı

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          build-root-directory: ./komodo-ders-asistanı

      - name: Create .env.example if missing
        run: |
          if [ ! -f ".env.example" ]; then
            touch .env.example
            echo "# Default env" >> .env.example
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: komodo-odak-debug-apk
          path: ./komodo-ders-asistanı/app/build/outputs/apk/debug/*.apk
